name: Validate Smart Orchestration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Current runtime and policy tests
        run: python -B scripts/test_current.py -v
      - name: Syntax and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q codex_workflow
          git diff --check
