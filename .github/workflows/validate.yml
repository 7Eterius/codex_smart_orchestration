name: Validate Smart Orchestration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Current contracts, candidates, installation and exact v1.9 migration
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Syntax and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q codex_workflow scripts
          git diff --check
