name: Prepare isolated Smart 3.1 source
on:
  push:
    branches: [smart/v3.1-balanced-routing]
    paths:
      - '.maintenance/smart-v31/**'
      - '.github/workflows/prepare-smart-v31.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == '7Eterius/codex_smart_orchestration' && github.ref == 'refs/heads/smart/v3.1-balanced-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble base-checked source changes
        run: |
          python -B .maintenance/smart-v31/prepare_v31.py
          python - <<'PY'
          from pathlib import Path
          p=Path('codex_workflow/runtime/smart_config.py')
          s=p.read_text()
          old='Dispatch useful independent work before waiting.'
          assert s.count(old)==1
          p.write_text(s.replace(old,'Dispatch useful independent work in parallel before waiting.'))
          PY
      - name: Validate full current suite and unchanged historical reference
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check syntax and source whitespace
        run: |
          python -m compileall -q codex_workflow scripts
          git diff --check
      - name: Commit validated source to this isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/smart-v31/publish_branch.py
