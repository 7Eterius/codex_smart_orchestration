name: Build and publish Smart Orchestration
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Matching version tag
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and package
        id: package
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then tag="$GITHUB_REF_NAME"; else tag="$MANUAL_TAG"; fi
          version="${tag#v}"
          python -B scripts/test_fork.py -v
          python -B scripts/test_deployment_token_report.py -v
          python -B scripts/test_verification.py -v
          python -B scripts/test_v15.py -v
          python -B scripts/package_smart.py --release-tag "$tag" --output-dir smart-dist
          python -B scripts/package_smart.py --verify "smart-dist/codex_workflow-${version}.zip" --version "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=smart-dist/codex_workflow-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_SHA: ${{ steps.package.outputs.sha }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$MANUAL_PRERELEASE" != "false" ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" smart-dist/SHA256SUMS \
            --title "Smart Orchestration $RELEASE_TAG" --target "$RELEASE_SHA" "${options[@]}"
