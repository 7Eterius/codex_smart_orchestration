name: Smart Orchestration validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Functional, policy and global-adoption tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/test_fork.py -v 2>&1 | tee smart-tests.log
          python -B scripts/test_deployment_token_report.py -v 2>&1 | tee token-tests.log
          python -B scripts/test_verification.py -v 2>&1 | tee verification-tests.log
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          python -B codex_workflow/runtime/workflow.py validate --package-root codex_workflow --json
          version="$(cat codex_workflow/operate/VERSION)"
          python -B scripts/package_smart.py --release-tag "v${version}" --output-dir smart-dist
          python -B scripts/package_smart.py --verify "smart-dist/codex_workflow-${version}.zip" --version "$version"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-orchestration-${{ matrix.python-version }}
          path: |
            smart-tests.log
            token-tests.log
            verification-tests.log
            smart-dist/codex_workflow-*.zip
            smart-dist/SHA256SUMS
