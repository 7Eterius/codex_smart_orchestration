name: Prepare isolated Smart 3.1.1 maintenance
on:
  push:
    branches: [maintenance/prepare-v3.1.1]
    paths:
      - '.maintenance/v311/**'
      - '.github/workflows/prepare-smart-v311.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == '7Eterius/codex_smart_orchestration' && github.ref == 'refs/heads/maintenance/prepare-v3.1.1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Assemble base-checked maintenance patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.maintenance/v311/tests.py')
          old="        with self.assertRaises(a.AllocationError):a.AllocationError('type guard') if False else None"
          new="        with self.assertRaises(old.AllocationError):old.next_action(obs,req)\n        self.assertEqual(a.next_action(obs,req)['reason'],'readback_only')"
          s=p.read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python -B .maintenance/v311/prepare.py
      - name: Current regressions and exact historical upgrades
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Syntax and whitespace
        run: |
          python -m compileall -q codex_workflow scripts
          git diff --check
      - name: Publish tested source to preparation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/v311/publish.py
