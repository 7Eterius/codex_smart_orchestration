name: Prepare isolated Smart 4.0
on:
  push:
    branches: [maintenance/prepare-v4.0.0]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == '7Eterius/codex_smart_orchestration' && github.ref == 'refs/heads/maintenance/prepare-v4.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Assemble pinned upgrade
        run: python -B .maintenance/v4/prepare.py
      - name: Current suite and exact historical migrations
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Syntax and whitespace
        run: |
          python -m compileall -q codex_workflow scripts
          git diff --check
      - name: Publish tested source to preparation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/v4/publish.py
